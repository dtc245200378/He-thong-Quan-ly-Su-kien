version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: event_management_system-postgres-1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${POSTGRES_DB:?missing}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: event_management_system-pgadmin-1
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?missing}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?missing}
    ports:
      - "5050:80"

  webapp:
    image: node:18-alpine
    container_name: event_management_system-webapp-1
    user: "1000:1000"
    working_dir: /app
    command: node server.js
    volumes:
      - ./app:/app
    expose:
      - "3000"
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:?Missing customer secret}
      DATABASE_URL: ${DATABASE_URL:?missing}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_missing}
  nginx:
    image: nginx:alpine
    container_name: event_management_system-nginx-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - webapp

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    expose:
      - "8080"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    env_file:
      - ./.local/postgres-exporter.env
    depends_on:
      - postgres
    expose:
      - "9187"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8080/stub_status"
    depends_on:
      - nginx
    expose:
      - "9113"

  node-exporter:

    image: prom/node-exporter:latest
    container_name: event_management_system-node-exporter-1
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    pid: host
    expose:
      - "9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: event_management_system-prometheus-1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: event_management_system-grafana-1
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:2.9.0
    container_name: event_management_system-loki-1
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    command: -config.file=/etc/loki/loki-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    container_name: event_management_system-promtail-1
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yaml

volumes:
  pgdata:
